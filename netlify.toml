# Netlify build configuration for healthcarecompliancepros.com
# Zero dependencies — the build is a single Node script.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# dist/_headers already carries the security + caching rules; these mirror the
# redirects that clean URLs need and the 404 fallback.
[[redirects]]
  from = "/index/login-page"
  to = "https://www.healthcarecompliancepros.com/index/login-page"
  status = 302
  force = false

# Specialty pages moved to their canonical top-level URLs.
[[redirects]]
  from = "/specialties/dermatology/*"
  to = "/dermatology-compliance-program/"
  status = 301
[[redirects]]
  from = "/specialties/behavioral-health/*"
  to = "/behavioral-health-compliance/"
  status = 301
[[redirects]]
  from = "/specialties/audiology/*"
  to = "/audiology-compliance-program/"
  status = 301
[[redirects]]
  from = "/specialties/physical-therapy/*"
  to = "/physical-therapy-compliance-program/"
  status = 301
[[redirects]]
  from = "/specialties/medspa/*"
  to = "/medspa/"
  status = 301

# Legacy /solutions/* aliases point at the canonical pages rather than
# duplicating content, which would split ranking signals.
[[redirects]]
  from = "/solutions/hipaa-compliance"
  to = "/compliance-solution/hipaa/"
  status = 301
[[redirects]]
  from = "/solutions/osha-compliance"
  to = "/compliance-solution/osha/"
  status = 301
[[redirects]]
  from = "/solutions/corporate-compliance"
  to = "/compliance-solution/corporate-compliance/"
  status = 301
[[redirects]]
  from = "/sentry"
  to = "/coding-compliance/"
  status = 301
[[redirects]]
  from = "/risk-assessment-healthcare"
  to = "/compliance-assessment/"
  status = 301
[[redirects]]
  from = "/consultation-form"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404
